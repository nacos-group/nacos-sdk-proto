[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nacos-sdk-proto"
version = "1.0.0-beta.11"
description = "Nacos SDK Protocol Buffers for Python"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Floors must track the grpcio-tools pin in .github/workflows: generated code
# refuses to import on a runtime older than the one it was generated with.
dependencies = [
    "protobuf>=7.35.1",
    "grpcio>=1.83.0",
]

[project.urls]
Repository = "https://github.com/nacos-group/nacos-sdk-proto"
